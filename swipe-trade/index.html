<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Swipe Trade</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="summary">
      <div class="summary-top">
        <span class="eyebrow">Portfolio value</span>
        <button class="reset" id="reset" type="button">Reset</button>
      </div>
      <div class="total" id="total">$0.00</div>
      <div class="day" id="day">—</div>
      <div class="stats">
        <div><span class="eyebrow">Cash</span><strong id="cash">$0.00</strong></div>
        <div><span class="eyebrow">Invested</span><strong id="invested">$0.00</strong></div>
      </div>
    </header>

    <div class="controls">
      <div class="tabs" role="tablist">
        <button role="tab" class="tab" data-tab="watch" aria-selected="true">Watchlist</button>
        <button role="tab" class="tab" data-tab="owned" aria-selected="false">Holdings <span id="owned-count" class="count">0</span></button>
      </div>
      <div class="size" role="radiogroup" aria-label="Shares per swipe">
        <span class="eyebrow">Shares per swipe</span>
        <button role="radio" data-qty="1" aria-checked="false">1</button>
        <button role="radio" data-qty="5" aria-checked="true">5</button>
        <button role="radio" data-qty="10" aria-checked="false">10</button>
        <button role="radio" data-qty="25" aria-checked="false">25</button>
      </div>
    </div>

    <p class="hint" id="hint">
      <span class="hint-buy">Swipe right → buy</span>
      <span class="hint-sell">← Swipe left to sell</span>
    </p>

    <ul class="list" id="list" aria-live="off"></ul>
    <p class="empty" id="empty" hidden>No holdings yet. Swipe a stock right on the watchlist to buy.</p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toast-msg"></span>
    <button id="toast-undo" type="button">Undo</button>
  </div>

  <script src="portfolio.js"></script>
  <script src="app.js"></script>
</body>
</html>
